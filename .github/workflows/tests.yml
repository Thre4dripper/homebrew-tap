name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap-syntax:
    name: tap syntax
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac # 2026.07.29.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Resolve tap name
        run: |
          echo "TAP=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | sed 's|/homebrew-|/|')" >>"$GITHUB_ENV"

      - name: Read all casks and formulae
        run: brew readall --os=all --arch=all --aliases "$TAP"

      - name: Check style
        # GoReleaser-generated files are skipped: every release overwrites them,
        # so style fixes there cannot survive.
        run: |
          cd "$(brew --repository "$TAP")"
          files=()
          for file in Casks/*.rb Formula/*.rb; do
            if [[ -f "$file" ]] && ! grep -qF "DO NOT EDIT" "$file"; then
              files+=("$file")
            fi
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No hand-written casks or formulae to check."
            exit 0
          fi
          brew style "${files[@]}"

      - name: Lint workflows
        run: |
          brew install actionlint
          cd "$(brew --repository "$TAP")"
          actionlint

      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --online --except=installed --tap="$TAP"

  install:
    name: install (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: tap-syntax
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac # 2026.07.29.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tap name
        run: |
          echo "TAP=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | sed 's|/homebrew-|/|')" >>"$GITHUB_ENV"

      - name: Install and uninstall every cask in the tap
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for cask in "$(brew --repository "$TAP")"/Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            brew install --cask "$TAP/$token"
            brew uninstall --cask "$TAP/$token"
          done
